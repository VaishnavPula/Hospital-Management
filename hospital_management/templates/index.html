<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hospital Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
    <button id="menu-button" class="menu-button" aria-label="Open menu" aria-expanded="true">☰</button>
    <a class="brand" href="/">🏥 <span>CityCare Hospital</span></a>
    <button id="theme-button" class="theme-button" aria-label="Toggle theme">🌙</button>
</header>

<aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-title">Menu</div>
        <button id="close-sidebar" class="close-sidebar" aria-label="Close menu">×</button>
    </div>
    <nav class="sidebar-nav">
        <a href="/" data-page="home"><span>⌂</span> Home</a>
        <a href="/patients.html" data-page="patients"><span>♙</span> Patients</a>
        <a href="/doctors.html" data-page="doctors"><span>⚕</span> Doctors</a>
        <a href="/appointments.html" data-page="appointments"><span>◷</span> Appointments</a>
        <a href="/billing.html" data-page="billing"><span>▣</span> Billing</a>
    </nav>
</aside>
<div id="sidebar-overlay" class="sidebar-overlay"></div>

<main>
<h1>Hospital Dashboard</h1>
<p class="subtitle">Manage hospital information easily.</p>

<div class="cards">
    <div class="card">
        <h2 id="patient-count">0</h2>
        <p>Patients</p>
    </div>
    <div class="card">
        <h2 id="doctor-count">0</h2>
        <p>Doctors</p>
    </div>
    <div class="card">
        <h2 id="appointment-count">0</h2>
        <p>Appointments</p>
    </div>
    <div class="card">
        <h2 id="bill-count">0</h2>
        <p>Bills</p>
    </div>
</div>

<div class="quick-links">
    <a class="button" href="/add_patient.html">Add Patient</a>
    <a class="button" href="/add_doctor.html">Add Doctor</a>
    <a class="button" href="/add_appointment.html">Add Appointment</a>
    <a class="button" href="/add_bill.html">Add Bill</a>
</div>
</main>
<script src="/static/script.js"></script>
</body>
</html>
