<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add Appointment</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
    <button id="menu-button" class="menu-button" aria-label="Open menu" aria-expanded="true">☰</button>
    <a class="brand" href="/">🏥 <span>CityCare Hospital</span></a>
    <button id="theme-button" class="theme-button" aria-label="Toggle theme">🌙</button>
</header>

<aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-title">Menu</div>
        <button id="close-sidebar" class="close-sidebar" aria-label="Close menu">×</button>
    </div>
    <nav class="sidebar-nav">
        <a href="/" data-page="home"><span>⌂</span> Home</a>
        <a href="/patients.html" data-page="patients"><span>♙</span> Patients</a>
        <a href="/doctors.html" data-page="doctors"><span>⚕</span> Doctors</a>
        <a href="/appointments.html" data-page="appointments"><span>◷</span> Appointments</a>
        <a href="/billing.html" data-page="billing"><span>▣</span> Billing</a>
    </nav>
</aside>
<div id="sidebar-overlay" class="sidebar-overlay"></div>

<main>
<h1 id="appointment-form-title">Add Appointment</h1>
<form class="form" id="appointment-form">
    <label>Patient</label>
    <select id="patient_id" required></select>

    <label>Doctor</label>
    <select id="doctor_id" required></select>

    <label>Date</label>
    <input id="appointment_date" type="date" required>

    <label>Time</label>
    <input id="appointment_time" type="time" required>

    <label>Reason</label>
    <textarea id="reason" required></textarea>

    <label>Status</label>
    <select id="status" required></select>

    <button class="button" type="submit">Save Appointment</button>
</form>
<p id="form-message"></p>
</main>
<script src="/static/script.js"></script>
</body>
</html>
